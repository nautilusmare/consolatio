<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>Consolatio</title>
    <meta name="description" content="A Reformed pastoral companion for the care of souls." />

    <!-- Fonts: loaded here rather than via a @import in the React tree, which
         re-ran the font fetch on every render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Lato:wght@300;400&display=swap"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0a07" />

    <!-- iOS PWA — critical for home screen install -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consolatio" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- iOS splash screens (optional but polished) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Prevent tap highlight on iOS -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; padding: 0; background: #0d0a07; }
      /* Safe area support for iPhone notch / Dynamic Island */
      #root {
        height: 100%;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
